name: PreStocks snapshot

on:
  schedule:
    - cron: '7,37 * * * *' # ~every 30 minutes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prestocks-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch PreStocks API + on-chain checks
        run: node scripts/fetch-prestocks.mjs
      - name: Commit snapshot
        if: always()
        run: |
          if git diff --quiet -- docs/data/prestocks.json; then
            echo "No change"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/prestocks.json
          git commit -m "data: PreStocks snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          exit 1
